<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tab bar fixture</title>
    <!-- DEBUG fixture (task 01a1557b): a fake web side for the native tab
         bar, loaded only by a Debug build launched with -BurrowTabBarFixture.
         Buttons send SuiteNative.tabBarState ({items, selected, more_dot,
         visible, ink, scheme}); every burrowNativeTab event is written into
         #events. A button marked data-ink="auto" adds the Burrow preset's
         inks for the page's own colour scheme (BURROW_INK, pinned to
         app.css by native_tab_bar_contract.test.js, task 01a174e8).
         ?mode=silent is a document that never sends a state (the bar must
         hide after didFinish); ?mode=auto sends one on load (it must stay). Rows under the bar give the glass something
         to refract. ?backdrop=white|black (task 01a174e8 stage 3) fills the
         page with one flat colour instead of the rows and sends the
         Chat-selected, dot-on state with the page scheme's inks on load,
         for the contrast measurement over the two extremes. -->
    <style>
      :root { color-scheme: light dark; --ink: #221f1b; --ground: #fbfaf9; --edge: #d9d3c9; }
      @media (prefers-color-scheme: dark) { :root { --ink: #eeeff1; --ground: #191b20; --edge: #383b42; } }
      html, body { margin: 0; background: var(--ground); color: var(--ink); font: 16px -apple-system, system-ui, sans-serif; }
      main { padding: calc(env(safe-area-inset-top) + 12px) 16px 160px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      button { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--edge); background: transparent; color: var(--ink); }
      #events { margin: 0 0 12px; padding-left: 20px; min-height: 24px; }
      #native { font: 11px ui-monospace, monospace; white-space: pre-wrap; margin: 0 0 12px; }
      :root[data-backdrop="white"], :root[data-backdrop="white"] body { --ink: #000000; --edge: #000000; background: #ffffff; }
      :root[data-backdrop="black"], :root[data-backdrop="black"] body { --ink: #ffffff; --edge: #ffffff; background: #000000; }
      :root[data-backdrop] #rows, :root[data-backdrop] #native, :root[data-backdrop] #glass,
      :root[data-backdrop] #doc, :root[data-backdrop] #viewport, :root[data-backdrop] #events { display: none; }
      /* Compact, so nothing but the flat colour reaches the bottom half
         of the screen, where the glass samples. */
      :root[data-backdrop] main { font-size: 11px; }
      :root[data-backdrop] h1 { font-size: 14px; }
      :root[data-backdrop] .controls { gap: 4px; margin-bottom: 4px; }
      :root[data-backdrop] button { font-size: 11px; padding: 3px 6px; border-radius: 6px; }
      :root[data-backdrop] p { margin: 2px 0; }
      .row { height: 64px; margin: 8px 0; border-radius: 12px; display: flex; align-items: center; padding: 0 16px; color: #fff; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tab bar fixture</h1>
      <div class="controls">
        <button data-ink="auto" data-state='{"items":["chat","voice","tasks","meetings","more"],"selected":"chat","more_dot":true,"visible":true}'>Chat, dot on</button>
        <button data-ink="light" data-state='{}'>Ink light</button>
        <button data-ink="dark" data-state='{}'>Ink dark</button>
        <button data-state='{"ink":{"selected":"orange","unselected":"#12"},"scheme":"sepia"}'>Ink malformed</button>
        <button data-state='{"selected":"chat"}'>Select chat</button>
        <button data-state='{"selected":"voice"}'>Select voice</button>
        <button data-state='{"selected":"tasks"}'>Select tasks</button>
        <button data-state='{"selected":"meetings"}'>Select meetings</button>
        <button data-state='{"selected":"more"}'>Select more</button>
        <button data-state='{"selected":null}'>Select none</button>
        <button data-state='{"more_dot":true}'>Dot on</button>
        <button data-state='{"more_dot":false}'>Dot off</button>
        <button data-state='{"visible":false}'>Hide bar</button>
        <button data-state='{"visible":true}'>Show bar</button>
        <button id="interrupt-visibility">Hide then show</button>
        <button data-state='{"items":["more","meetings","tasks","voice","chat"]}'>Reorder</button>
        <button data-state='{"items":["chat","games","voice","tasks","meetings","more"]}'>Unknown key</button>
        <button data-state='{"items":[],"selected":"chat"}'>Empty items</button>
        <button data-state='{"selected":"voice","more_dot":true}'>No items field</button>
        <a href="tabbar-fixture.html?mode=silent">Silent page</a>
        <a href="tabbar-fixture.html?mode=auto">Stateful page</a>
        <a href="tabbar-fixture.html?backdrop=white">Backdrop white</a>
        <a href="tabbar-fixture.html?backdrop=black">Backdrop black</a>
      </div>
      <p id="plugin">plugin: checking</p>
      <ol id="events"></ol>
      <p id="doc">doc: checking</p>
      <p id="viewport">viewport: checking</p>
      <p id="rendered">rendered: waiting for the first state</p>
      <p id="glass">glass: waiting for the first state</p>
      <div id="rows"></div>
      <pre id="native"></pre>
    </main>
    <script>
      (function () {
        // The Burrow preset's tab inks as the NativeTabBar hook sends them
        // ('#rrggbbaa'): --native-tab-selected (--color-interactive light,
        // --color-primary dark) and --native-tab-unselected (opaque
        // --color-base-content), the token layer in app.css (task 01a174e8
        // stage 3's contrast substitution).
        var BURROW_INK = {
          light: { selected: "#8b3b04ff", unselected: "#000000ff" },
          dark: { selected: "#f47721ff", unselected: "#eeeff1ff" },
        };
        function pageScheme() {
          return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        function withInk(state, which) {
          if (!which) return state;
          var scheme = which === "auto" ? pageScheme() : which;
          state.ink = BURROW_INK[scheme];
          state.scheme = scheme;
          return state;
        }
        var colours = ["#ad4b07", "#0e7382", "#635b53", "#f1383e", "#221f1b", "#f47721", "#22d3ee"];
        var rows = document.getElementById("rows");
        for (var i = 0; i < 28; i++) {
          var row = document.createElement("div");
          row.className = "row";
          row.style.background = colours[i % colours.length];
          row.textContent = "Row " + (i + 1);
          rows.appendChild(row);
        }

        function plugin() {
          var cap = window.Capacitor;
          return cap && cap.Plugins && (cap.Plugins.BurrowNative || cap.Plugins.SuiteNative);
        }
        var p = plugin();
        document.getElementById("plugin").textContent =
          "plugin: " + (p && typeof p.tabBarState === "function" ? "tabBarState present" : "tabBarState missing");

        function docLine() {
          var root = document.documentElement;
          var height = getComputedStyle(root).getPropertyValue("--native-tab-bar-height").trim() || "unset";
          document.getElementById("doc").textContent =
            "doc: attr=" + root.hasAttribute("data-native-tab-bar") + " height=" + height;
        }
        docLine();

        // The web hook's desktop breakpoint (native_tab_bar.js DESKTOP_QUERY):
        // at or past it the web shows its rail and keeps the native bar hidden.
        function viewportLine() {
          document.getElementById("viewport").textContent =
            "viewport: width=" + window.innerWidth + " desktop=" + window.matchMedia("(min-width: 1024px)").matches;
        }
        viewportLine();
        window.addEventListener("resize", viewportLine);

        var mode = (location.search.match(/mode=(\w+)/) || [])[1] || "buttons";
        if (mode === "auto" && p && typeof p.tabBarState === "function") {
          p.tabBarState(withInk({ items: ["chat", "voice", "tasks", "meetings", "more"], selected: "tasks", more_dot: false, visible: true }, "auto"))
            .catch(function () {});
        }
        var backdrop = (location.search.match(/backdrop=(white|black)/) || [])[1];
        if (backdrop) {
          document.documentElement.setAttribute("data-backdrop", backdrop);
          if (p && typeof p.tabBarState === "function") {
            p.tabBarState(withInk({ items: ["chat", "voice", "tasks", "meetings", "more"], selected: "chat", more_dot: true, visible: true }, "auto"))
              .catch(function () {});
          }
        }
        var modeLine = document.createElement("p");
        modeLine.textContent = "mode: " + mode + (backdrop ? " backdrop=" + backdrop : "");
        document.querySelector("main").insertBefore(modeLine, document.getElementById("plugin"));

        document.querySelectorAll("button[data-state]").forEach(function (button) {
          button.addEventListener("click", function () {
            var target = plugin();
            if (!target || typeof target.tabBarState !== "function") return;
            var state = withInk(JSON.parse(button.getAttribute("data-state")), button.getAttribute("data-ink"));
            target.tabBarState(state).catch(function () {});
          });
        });

        // Interrupt the real native animation: the promise acknowledges the
        // state request, not animation completion. No timer drives this case.
        document.getElementById("interrupt-visibility").addEventListener("click", function () {
          var target = plugin();
          if (!target || typeof target.tabBarState !== "function") return;
          target.tabBarState({ visible: false })
            .then(function () { return target.tabBarState({ visible: true }); })
            .catch(function () {});
        });

        window.addEventListener("burrowNativeTab", function (event) {
          var detail = event.detail || {};
          var item = document.createElement("li");
          item.textContent = detail.key + " reselect=" + (detail.reselect === true);
          document.getElementById("events").appendChild(item);
        });

        // DEBUG: the shell re-issued a failed load and this page is the result
        // (task 01a17d1f stage 2). Absent on a normal launch.
        window.burrowFixtureRecovered = function (count) {
          var line = document.getElementById("recovery");
          if (!line) {
            line = document.createElement("p");
            line.id = "recovery";
            document.body.appendChild(line);
          }
          line.textContent = "recovery: " + count;
        };

        // A recreated controller must complete a real native round trip.
        window.burrowFixtureRecreated = function () {
          var target = plugin();
          if (!target || typeof target.tabBarState !== "function") return;
          target.tabBarState(withInk({ items: ["chat", "voice", "tasks", "meetings", "more"], selected: "chat", more_dot: false, visible: true }, "auto"))
            .then(function () {
              var line = document.createElement("p");
              line.textContent = "recreated: 1; bridge: tabBarState round trip passed";
              document.body.appendChild(line);
            });
        };

        // DEBUG probe from BurrowBridgeViewController.reportTabBarFixture.
        window.burrowFixtureNative = function (report) {
          docLine();
          document.getElementById("rendered").textContent = "rendered: " + report.rendered;
          document.getElementById("glass").textContent =
            "glass: hosting=" + report.hosting + " effect=" + report.glass_effect + " class=" + report.glass_class +
            " floating=" + report.floating + " platter=" + report.platter + " bar=" + report.bar + " os=" + report.os;
          document.getElementById("native").textContent = "transition: " + report.transition + "\n" + report.tree;
        };
      })();
    </script>
  </body>
</html>
