name: Cut release candidate

on:
  schedule:
    - cron: "11 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

# Share the promoter's lock: recording a candidate and promotion cannot race.
concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=ghcr.io/getburrowing/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Cut newest verified main batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_BATCH_ENABLED: ${{ vars.STABLE_BATCH_ENABLED }}
          STABLE_SOAK_MODE: ${{ vars.STABLE_SOAK_MODE }}
          STABLE_HOLD: ${{ vars.STABLE_HOLD }}
        run: python3 deployment/release/cut_candidate.py
