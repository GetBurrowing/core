name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Test-count floor for the MAIN `mix test --include slow` pass in `Run tests`
  # (task 01a08e20). It is a CRASH DETECTOR, not a coverage gate: on PR #997
  # attempt 1 the BEAM aborted mid-suite (`[asmjit] Assertion failed`), ExUnit
  # printed no summary line, and the job still concluded success having run
  # 9 tests. The step fails if the first pass prints no `N tests, M failures`
  # summary or N is below this floor. The suite is ~16.8k tests today; the
  # floor is deliberately far below that so it only fires on a run that did
  # not reach the end. Raise it here when the suite grows well past it; it is
  # never a reason to delete tests. `Platform.CiCrashGuardTest` pins the
  # variable and its use.
  #
  # Since ADR 0055 the `Test` job is the WITHOUT-modules build: apps/platform
  # alone. Measured on the test rig at the task 01a0ee08 stage 3 tip (426f9d30c),
  # without Play: 20,083 tests (default run, no `--include slow`). That is
  # 5,083 above this floor, so the floor still sits far below the suite and
  # far above any partition, which is all a crash detector needs; it is not
  # raised to the measured total, because a floor AT the total would turn
  # every deleted or moved test into a red build.
  MIN_TEST_COUNT: 15000
  # The same crash detector for the `Test (with Play)` job's module suite
  # (apps/game_stream's own `mix test`): 196 tests at that tip.
  MIN_PLAY_TEST_COUNT: 150
  # The same crash detector for the `Test (with Social)` job's module suite
  # (apps/social's own `mix test`): 47 tests at task 01a140a8's tip.
  MIN_SOCIAL_TEST_COUNT: 35

on:
  push:
    branches: [main, "feat/**", "stack/**"]
  pull_request:
    branches: [main, "feat/**", "stack/**"]

jobs:
  test:
    name: Test
    runs-on: [self-hosted, linux, x64]
    # WORKSPACE OWNERSHIP ON A SELF-HOSTED RUNNER
    #
    # This container runs as root, which it must — `Install system packages`
    # below calls apt-get, and a non-root container fails there with
    # "List directory /var/lib/apt/lists/partial is missing".
    #
    # But on a self-hosted runner every job shares one `_work` checkout, so a
    # root container leaves root-owned files the NEXT job — running on the
    # host as uid 1000 — cannot delete. `actions/checkout` then dies at its
    # "Deleting the contents of" step with `EACCES: unlink`, seconds in and
    # before any step of the job it belongs to. That is what broke
    # `Build and push image` on the first push to main after #879.
    #
    # Pinning the container to `--user 1000:1000` fixes the ownership and
    # breaks apt. `Hand the workspace back` at the end of this job does
    # neither: stay root, and chown on the way out (and delete dependency
    # `_build` dirs, whose SELinux labels chown cannot fix; see that step).
    #
    # None of this is visible on GitHub-hosted runners, where every job gets a
    # fresh machine and nothing is shared.
    container:
      image: elixir:1.20.4-otp-28-slim
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        # NO `ports:` MAPPING, DELIBERATELY.
        #
        # The job talks to this service by its network alias — `PGHOST:
        # postgres` below — over the per-job container network Actions
        # creates. It never needs a host port, and publishing one makes
        # 5432 a machine-wide singleton: the SECOND concurrent job on the
        # same runner host dies at "Initialize containers" with
        #
        #   Bind for 0.0.0.0:5432 failed: port is already allocated
        #
        # before a single step of it runs. That was invisible while the org
        # had one self-hosted runner and could only ever run one job at a
        # time; it surfaced the moment a second and third were registered.
    env:
      MIX_ENV: test
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    # Read by the `first-run-green` job below. Task 01a08d81: this job's
    # CONCLUSION is `success` for both first-run-green and failed-then-
    # retry-green, so branch protection requiring "Test" cannot tell them
    # apart. The output is the per-run OUTCOME the retry path records.
    outputs:
      retry_fired: ${{ steps.run-tests.outputs.retry_fired }}
    defaults:
      run:
        working-directory: apps/platform

    steps:
      # BEFORE checkout, so actions/checkout finds git and makes a real
      # repository. Without git it falls back to a REST download with no
      # .git, and the install-identity guard
      # (test/platform/regression/install_identity_guard_test.exs), which
      # scans `git ls-files`, fails by design. The workspace does not exist
      # yet, hence the working directory.
      - name: Install system packages
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git
          update-ca-certificates

      - uses: actions/checkout@v5

      # Across EVERY migrations path: core's and each build-time module's
      # (ADR 0055). schema_migrations keys on the version alone, so a version
      # shared by two paths is one migration to every database and one of
      # the two files silently never runs. Mirrors
      # apps/platform/test/platform/migration_paths_test.exs.
      - name: Check for duplicate migration timestamps
        working-directory: ${{ github.workspace }}
        run: |
          files=$(ls apps/*/priv/repo/migrations/*.exs)
          dupes=$(for f in $files; do basename "$f"; done | awk -F_ '{print $1}' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration timestamp(s) detected across migrations paths:"
            for ts in $dupes; do
              echo "  $ts:"
              ls apps/*/priv/repo/migrations/${ts}_* | sed 's/^/    /'
            done
            exit 1
          fi

      # Every module and release host lockfile must lock core's entries
      # exactly as apps/platform/mix.lock does (ADR 0055 § 1): Mix ignores a
      # path dependency's lockfile, so nothing else keeps the with-modules
      # build on the versions this job tests. Mirrors
      # apps/platform/test/platform/module_lockfiles_test.exs.
      - name: Check module lockfiles against core's
        working-directory: ${{ github.workspace }}
        run: elixir scripts/check-module-lockfiles.exs

      - name: Check surface line budgets
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/check-surface-budget.sh
          if ! sh scripts/check-surface-budget.sh; then
            echo "::error::Surface line budget check failed. See annotations above. Budgets live in scripts/surface-budgets.txt; raising one requires a justification in the commit message."
            exit 1
          fi
          sh scripts/test/surface_budget_check_test.sh

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: apps/platform/deps
          key: deps-${{ hashFiles('apps/platform/mix.lock') }}
          restore-keys: deps-

      - name: Install dependencies
        run: mix deps.get

      # The JS suites had NO CI gate at all until this.
      #
      # WHY THIS IS A STEP IN THIS JOB AND NOT A SEPARATE PARALLEL JOB.
      # The three commands take ~0.9 s combined, so nothing about runtime
      # argues either way; setup dominates entirely. The deciding fact is that
      # test/no_excalidraw_in_app_bundle_test.mjs esbuild-builds js/app.js, and
      # js/app.js imports "phoenix", "phoenix_html" and "phoenix_live_view",
      # whose JavaScript ships inside apps/platform/deps — i.e. it needs
      # `mix deps.get` to have run. A standalone node-only job could therefore
      # gate vitest and the localStorage script but NOT the bundle guard, which
      # is the one check here that protects a user-visible number (the 800 KB
      # app.js ceiling). Running the suites in the job that has already fetched
      # and cached deps gates all three for the cost of installing Node.
      #
      # It is placed immediately after deps.get and before the compile/test
      # steps so a JS break surfaces in about a minute rather than after the
      # full Elixir suite — the same fail-fast shape as the migration-timestamp
      # and surface-budget checks at the top of this job.
      #
      # TRIGGERS: this workflow has no `paths:` filter, deliberately. These
      # steps run on every push to main/feat/**/stack/** and every PR into
      # them, including PRs that touch only .github/, only lib/, or only a
      # colocated hook outside assets/. Scoping them to apps/platform/assets/**
      # would have missed exactly the case that motivated this task: PR #809
      # changed a contract and broke a sibling test file, and nobody found out.
      - name: Set up Node
        # 24 is not invented here: it is the version this workflow already
        # forces its JavaScript actions onto (see FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
        # at the top of this file). The repo pins Node nowhere else — no
        # .nvmrc, no `engines` in assets/package.json.
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/platform/assets/package-lock.json

      - name: Install JS dependencies
        working-directory: apps/platform/assets
        run: npm ci

      # These are the three commands assets/package.json's `test` script
      # chains, run separately so the annotation names which one broke.
      # `npm test` itself is not invoked because a single `&&` chain reports
      # only the first failure and gives no per-suite signal.
      - name: Run JS asset test suites
        working-directory: apps/platform/assets
        run: |
          if ! npx vitest run; then
            echo "::error::vitest failed (apps/platform/assets/test/**/*.test.js). Fix the test or the hook; do not skip it."
            exit 1
          fi
          if ! node --test "test/**/*_test.mjs"; then
            echo "::error::node --test failed (apps/platform/assets/test/**/*_test.mjs). This set includes the js/app.js bundle guards, which esbuild-build the real app bundle against apps/platform/deps."
            exit 1
          fi
          if ! node scripts/check_no_direct_localstorage.mjs; then
            echo "::error::check_no_direct_localstorage.mjs failed: js/ contains a direct localStorage access. Route it through the client-state wrapper."
            exit 1
          fi

      # Task 01a01041 stage 6 — the ratchet that keeps the warning cleanup from
      # rotting. It lands in the same PR as the cleanup on purpose: added before
      # it, this step would red every PR including the ones fixing the warnings.
      #
      # SCOPE — what this step does and does not gate.
      #
      # COVERS:
      #   * apps/platform/lib/**            (compiled in BOTH dev and test)
      #   * apps/platform/test/support/**   (test env only — apps/platform/mix.exs
      #     puts test/support on elixirc_paths(:test) and nowhere else, which is
      #     the whole reason the MIX_ENV=test half below is not redundant. A
      #     dev-only gate cannot see a warning in a test helper and looks
      #     identical to a working one until somebody touches one.)
      #   * .heex markup compiled through ~H or embed_templates, since those are
      #     compiled as part of the modules above.
      #
      # DOES NOT COVER:
      #   * apps/platform/test/**/*_test.exs — test files are not on
      #     elixirc_paths; they are compiled by `mix test`, not `mix compile`, so
      #     a warning in a *_test.exs file does not fail this step.
      #   * dependency warnings — deps are built by `deps.compile`, not by this
      #     invocation, so warnings emitted from deps/** (e.g. the Timex
      #     struct-update warnings in a cold _build) never reach this gate.
      # Both gaps are stated rather than left to be discovered.
      #
      # The flag lives here and NOT as `warnings_as_errors: true` in
      # elixirc_options in mix.exs: that would make every local `mix compile` and
      # `mix test` fail on a warning mid-edit. The CI flag is the narrower change.
      - name: Compile with warnings as errors (dev + test)
        run: |
          if ! MIX_ENV=dev mix compile --force --warnings-as-errors; then
            echo "::error::mix compile --warnings-as-errors failed in MIX_ENV=dev. Fix the warning; do not add --no-warnings-as-errors, @compile {:no_warn_undefined, ...} or a @dialyzer pragma. See apps/platform/notes/2026-08-17-compile-warnings-baseline.md."
            exit 1
          fi
          if ! MIX_ENV=test mix compile --force --warnings-as-errors; then
            echo "::error::mix compile --warnings-as-errors failed in MIX_ENV=test (this env additionally compiles test/support via elixirc_paths(:test)). Same rule: fix the warning, never suppress it."
            exit 1
          fi

      - name: Check formatting
        run: mix format --check-formatted

      - name: Set up database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Run tests
        id: run-tests
        run: |
          # `--include slow` is load-bearing, not decoration: `Platform.SlowTests`
          # excludes the `:slow` tag from the DEFAULT run, and this flag is the
          # named thing that still runs those tests — including the 16s
          # reproductions of the provider timeout bug from task 01a0826f.
          # Removing it silently shrinks the suite. `Platform.SlowTestsTest`
          # asserts this flag is still spelled here.
          # Exit-status capture, and it is load-bearing: `mix test | tee log`
          # reports TEE's status, not mix's, so a naive `|| retry` would never
          # fire and every first-pass failure would look green. `set -o pipefail`
          # inside an `if !` is what makes the pipeline report mix's status
          # (the `if` context also suspends the default `bash -e` errexit, so a
          # red first pass reaches the retry instead of aborting the step).
          set -o pipefail
          first_pass_log="${RUNNER_TEMP:-.}/mix-test-first-pass.log"

          # Test-count floor on the main pass (task 01a08e20; the floor value
          # and its rationale are at the workflow `env:` block). Reads the
          # first pass's own ExUnit summary line and fails the step if there
          # is none or the count is below MIN_TEST_COUNT. Scoped to
          # $first_pass_log only, so the small partitions below
          # (`--only isolated_beam`, the boot-telemetry pair) never trip it.
          assert_test_count_floor() {
            local summary count
            # `|| true`: under pipefail a no-match grep would otherwise abort
            # the `bash -e` step before the ::error:: below is printed.
            #
            # ExUnit 1.20 summary shapes: `Result: 16958 passed`, with failures
            # `Result: 16950/16958 passed`, and with no tests at all
            # `Result: 0 tests`. Each may carry a `(... doctests, ... tests)`
            # breakdown and `, N skipped` / `, N excluded` after it, which the
            # `-o` match leaves off. The LAST number in the match is the total
            # (doctests included). Before 1.20 the line was `N tests, M failures`.
            summary=$(grep -oE 'Result: [0-9]+(/[0-9]+)? (passed|tests)' "$first_pass_log" | tail -n1 || true)
            # The bare `echo` first: a dead first pass leaves ExUnit's progress
            # dots mid-line, and GitHub only reads `::error::` at column 0
            # (measured on control run 34552027555: red step, no annotation).
            if [ -z "$summary" ]; then
              echo
              echo "::error::main mix test pass printed no ExUnit summary line (Result: N passed) — the suite did not run to completion"
              exit 1
            fi
            count=$(printf '%s' "$summary" | grep -oE '[0-9]+' | tail -n1)
            if [ "$count" -lt "$MIN_TEST_COUNT" ]; then
              echo
              echo "::error::main mix test pass ran $count tests, below MIN_TEST_COUNT=$MIN_TEST_COUNT — the suite did not run to completion (raise the floor in ci.yml env: if the suite legitimately shrank)"
              exit 1
            fi
            echo "main mix test pass ran $count tests (floor MIN_TEST_COUNT=$MIN_TEST_COUNT)"
          }

          # `retry_fired` is THIS run's outcome — did the serial retry fire —
          # written to $GITHUB_OUTPUT so the `first-run-green` job can read it
          # without grepping a log. It is written exactly once per exit path:
          # `false` below the retry block on a green first pass, `true` inside
          # the retry-green branch. A retry-red path exits 1 and writes nothing;
          # the job is red, and `first-run-green` is skipped behind `needs`.
          if ! mix test --include slow 2>&1 | tee "$first_pass_log"; then
            # Harvest the failed test names from the FIRST pass's ExUnit failure
            # blocks. Not the `--failed` manifest: that file
            # (`_build/test/lib/platform/.mix/.mix_test_failures`) is an Erlang
            # external-term-format binary, it is not shell-readable, and it
            # carries module + test name + file but NO line number.
            failed_tests=$(
              awk '
                /^[[:space:]]*[0-9]+\) (test|doctest) /{
                  hdr=$0; sub(/^[[:space:]]*[0-9]+\) /,"",hdr); want=1; next
                }
                want && /\.exs:[0-9]+[[:space:]]*$/{
                  loc=$0; sub(/^[[:space:]]*/,"",loc); sub(/[[:space:]]*$/,"",loc)
                  print loc " — " hdr; want=0
                }
              ' "$first_pass_log" | sort -u
            )
            # Nameless-retry refusal (task 01a08e20). A first pass that exits
            # non-zero WITHOUT any ExUnit failure block is a crash, not a flake:
            # on PR #997 attempt 1 the BEAM aborted (`[asmjit] Assertion
            # failed`, core dumped), the harvest above found nothing,
            # `mix test --failed` ran an empty manifest, printed `There are no
            # tests to run`, exited 0, and the job concluded success. There is
            # nothing to retry, so refuse before the retry command runs and
            # before `retry_fired` is written. This check MUST stay above the
            # `mix test --failed` line below. It writes NOTHING to
            # $GITHUB_OUTPUT: the retry never ran, so `retry_fired=true` would
            # be false; `first-run-green`'s `*)` arm already handles the
            # missing output. The bare `echo` first: the crash leaves ExUnit's
            # progress dots mid-line and GitHub only reads `::error::` at
            # column 0 (measured on control run 34552027555).
            if [ -z "$failed_tests" ]; then
              echo
              echo "::error::initial mix test failed with no ExUnit failures harvested (crash, not flake)"
              exit 1
            fi
            assert_test_count_floor

            # Annotations are single-line; %0A is GitHub's newline escape.
            echo "::warning::initial mix test failed; retrying failed tests serially. First pass failed these tests:%0A$(echo "$failed_tests" | sed 's/$/%0A/' | tr -d '\n')"

            if mix test --failed --max-cases 1 --include slow; then
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                {
                  echo "### Retry-greened tests"
                  echo
                  echo "These tests failed on the first \`mix test --include slow\` pass and passed on the serial retry. The build is green, but each one is a flake that would otherwise be invisible."
                  echo
                  echo "$failed_tests" | sed 's/^/- /'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "retry_fired=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "::error::initial mix test failed and the serial retry did NOT fix it. See the failures above."
              exit 1
            fi
          fi
          assert_test_count_floor
          echo "retry_fired=false" >> "$GITHUB_OUTPUT"

      # Task 01a08d5d (carved out of 01a08b49). QUEUED-BEYOND-DRAIN in
      # test/platform_web/conn_case_supervised_orphan_beyond_drain_test.exs
      # detaches the audit telemetry handler VM-WIDE on purpose — the guardian
      # repairing that detach is the case's whole deliverable — and its orphan
      # exits asynchronously after its own teardown, so the detach lands inside
      # a sibling module's `handler_attached?()` positive control (measured in
      # CI run 34529749646). `async: false` was measured and refuted: it flips
      # the sandbox to shared mode, changes the teardown branch and turns
      # `@tag sandbox_drain_timeout:` into a silent no-op, so the case stops
      # reproducing the defect while still reading as a passing test. The only
      # isolation that holds is the BEAM boundary: `Platform.IsolatedBeamTests`
      # excludes the `:isolated_beam` tag from the run above and this step runs
      # it in its own OS process. `Platform.IsolatedBeamTestsTest` asserts this
      # exact invocation is still spelled here.
      #
      # Do NOT add `--include slow` here: `--only X` expands to
      # `--include X --exclude test`, so a second `--include` is another way IN
      # (measured: 3 tests became 9). No `||` retry either — a retry-green on a
      # 3-test partition is exactly the signal this step exists to surface.
      - name: Beyond-drain orphan + guardian repair (isolated BEAM)
        run: mix test --only isolated_beam

      # Task 019f9d80. `Platform.Audit.HistorianLatencyTest` used to detach the
      # VM-global `Platform.Audit.TelemetryHandler` and never put it back, which
      # silenced the audit bridge for every later test in the same BEAM. The
      # visible casualty was
      # `Platform.Accounts.ExternalAdmissionNotifierTest`'s durable-queue
      # assertion, which read `[]` and failed 10/10 at ten fixed seeds while
      # being written off as a flake across roughly eight briefs.
      #
      # The invariant this step pins is "these two files run in the SAME BEAM",
      # NOT "in this order". Measured on the control tree: reversing the two
      # paths on the command line does not reverse execution —
      # `--trace` shows `HistorianLatencyTest` scheduled first either way, since
      # both modules are `async: false` and ExUnit's sync-module ordering is not
      # the CLI argument order. Do not rewrite this step's rationale as an
      # ordering guarantee; a guard that looks like it pins ordering and does
      # not is the defect class this task exists to close.
      #
      # It is a separate step rather than an in-suite test for two reasons: the
      # full suite is NOT a detector here (it ran green at seed 0 on a tree
      # where this two-file run was 100% reproducible, because whether the two
      # files land in the same partition is seed-dependent), and ExUnit cannot
      # express a cross-file same-BEAM requirement from inside a run without a
      # `System.cmd("mix", ["test", ...])` subprocess, for which there is no
      # precedent anywhere in apps/platform/test.
      #
      # The authoring-time half of the guarantee — no new test may detach a
      # boot-attached handler without restoring it first — is
      # test/platform/regression/boot_telemetry_handler_detach_audit_test.exs,
      # which runs in the default `mix test` set above.
      #
      # The retry below is the WHOLE command again, deliberately — NOT
      # `mix test --failed`. `--failed` reruns only the failed tests, serially,
      # which re-partitions them, so a genuine cross-file failure turns green on
      # the retry (that is what the step above does, and it is a structural
      # reason this bug survived CI for months — flagged, not removed here; see
      # apps/platform/notes/2026-07-26-boot-telemetry-detach.md §5).
      # Re-running the identical two-file command preserves the same-BEAM
      # invariant, so mechanism A — measured deterministic at 10/10 across ten
      # fixed seeds — still fails both attempts. What the retry absorbs is
      # `historian_latency_test.exs`'s @p99_budget_us wall-clock assertion,
      # independently measured at 2/10 on a clean control and unrelated to this
      # invariant; two independent draws put it at ~4%. If this step ever fails
      # twice, read the failing test NAME before assuming the flake.
      - name: Boot-telemetry-handler cross-file regression (same BEAM)
        run: |
          pair="test/platform/audit/historian_latency_test.exs test/platform/accounts/external_admission_notifier_test.exs"
          mix test $pair --seed 0 || (echo "::warning::boot-telemetry pair failed; re-running the SAME two-file command" && mix test $pair --seed 0)

      # Runs even when the suite fails: an aborted job leaves the same
      # root-owned files as a passing one, and the next job is equally unable
      # to remove them. Guarding on success would mean a single red run
      # poisons the workspace until someone clears it by hand from a root
      # container — which is the state this repo was actually in.
      #
      # Ownership is not the only thing a root container leaves behind. The
      # runner host runs SELinux enforcing, and rebar3 builds its plugins for erlexec
      # (pulled in by `imp`, #1151) under `deps/erlexec/_build/`. Those files
      # carry this container's private MCS categories
      # (`container_file_t:s0:c260,c533`, measured on a self-hosted runner), while
      # the rest of the workspace is plain `s0`. `installer` runs
      # actions/checkout inside ITS OWN container, whose categories differ,
      # so the scandir fails with `EACCES` even though the files are owned by
      # 1000 and mode 755. chown does not change a label. Deleting the
      # directories from here, while still in the container that labelled
      # them, is what works. checkout would wipe them on the next job anyway,
      # so no cache is lost.
      - name: Hand the workspace back to the runner
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE"/apps/platform/deps/*/_build || true
          chown -R 1000:1000 "$GITHUB_WORKSPACE" || true

  # Task 01a08d81. Branch protection can only require a NAMED check, and it is
  # satisfied by that job's conclusion. `Test` concludes `success` for both a
  # first-run-green suite and a failed-then-serially-retried one (the `||`
  # retry in `Run tests` above), so requiring `Test` does not gate retry-green.
  # This job is the distinct check protection can require instead: it is keyed
  # to an OUTCOME — did the retry fire on THIS run — never to a rate. (A rate
  # rule at the measured 13/40 – 21/40 retry base rate would block a third of
  # merges and be switched off within a week; see
  # apps/platform/notes/2026-09-10-ci-retry-census.md §6 and §11.)
  #
  # It reads the `retry_fired` job output the `Run tests` step wrote, and
  # nothing else: no checkout, no container, no `mix test`, no `--include slow`,
  # and no `||` retry of its own. `Test`'s semantics are unchanged — it stays
  # green on retry-green, so nothing merging today is blocked by this job
  # until protection is told to require `first-run-green`.
  #
  # Task 01a136c1. `continue-on-error` below is true ONLY for a push to
  # refs/heads/main. A main push happens after the merge, so no PR gate reads
  # that run's `first-run-green`; there, a retry-green build used to drive the
  # whole workflow conclusion to `failure` (run 38486558565) even though every
  # image/publish job succeeded. With it, the step still goes red and prints
  # its `::error::` annotation, and the Test job's `Retry-greened tests`
  # summary is unchanged, so the signal stays visible; it just stops failing
  # the workflow. On `pull_request` runs and on pushes to any other branch the
  # expression is false, so the required `first-run-green` check fails exactly
  # as before. Do not make it unconditional, and do not rename or move this
  # job: branch protection matches the check by name.
  # `Platform.CiFirstRunGreenTest` pins this job's presence, the literals it
  # depends on, and both clauses of the `continue-on-error` expression.
  first-run-green:
    name: first-run-green
    needs: test
    runs-on: [self-hosted, linux, x64]
    continue-on-error: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Fail iff the Test job's serial retry fired on this run
        env:
          RETRY_FIRED: ${{ needs.test.outputs.retry_fired }}
        run: |
          case "$RETRY_FIRED" in
            false)
              echo "first-run green: the Test job's serial retry did not fire on this run."
              ;;
            true)
              echo "::error::first-run-green: the Test job went green only after its serial retry (see the Test job's 'Retry-greened tests' summary for the names). The build is retry-green, not first-run-green."
              exit 1
              ;;
            *)
              echo "::error::first-run-green: Test job output retry_fired is '${RETRY_FIRED}', expected 'true' or 'false'. The Run tests step no longer writes it; see Platform.CiFirstRunGreenTest."
              exit 1
              ;;
          esac

  # The WITH-Play build (ADR 0055, task 01a0ee08 stage 4). `Test` above is the
  # without-modules build and is unchanged; this job proves the other flavour:
  #
  #   * apps/game_stream (Play) compiles against core with
  #     --warnings-as-errors in dev and test, is formatted, and its own ExUnit
  #     suite passes (its `test` alias creates the database and migrates
  #     core's path AND the module's, as Platform.Release.migrate/0 does);
  #   * apps/burrow_release (the with-modules image's host) compiles;
  #   * the with-Play stylesheet keeps every rule core's has;
  #   * the module's vitest suite passes;
  #   * core's two bundle guards pass on the WITH-Play app.js (the generated
  #     `@extensions` entry), which must stay under the cap and must contain
  #     the module's hook literal (the positive control for the without-Play
  #     absence check in `Test`).
  #
  # Both `Test` and `Test (with Play)` are meant to be required checks.
  test-with-play:
    name: Test (with Play)
    runs-on: [self-hosted, linux, x64]
    # Root container for apt, and the workspace handed back at the end: the
    # same WORKSPACE OWNERSHIP reasoning as `test` above.
    container:
      image: elixir:1.20.4-otp-28-slim
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        # No `ports:` mapping, for the reason given on `test`'s service.
    env:
      MIX_ENV: test
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: apps/game_stream

    steps:
      - uses: actions/checkout@v5

      - name: Install system packages (with Play)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git
          update-ca-certificates

      - name: Install Hex and Rebar (with Play)
        run: |
          mix local.hex --force
          mix local.rebar --force

      # One cache per project: Mix ignores a path dependency's lockfile, so
      # each project resolves (and stores) its own deps.
      - name: Cache module deps
        uses: actions/cache@v5
        with:
          path: |
            apps/game_stream/deps
            apps/social/deps
            apps/burrow_release/deps
            apps/platform/deps
          key: deps-with-play-${{ hashFiles('apps/game_stream/mix.lock', 'apps/social/mix.lock', 'apps/burrow_release/mix.lock', 'apps/platform/mix.lock') }}
          restore-keys: deps-with-play-

      # Once per env: core is a path dependency compiled in the module's env
      # (`env: Mix.env()`), so `deps.get` fetches only the deps core needs IN
      # that env. Core's `only: :dev` deps (phoenix_live_reload) are absent
      # after a test-env fetch, and the dev compile below then stops with
      # "the dependency is not available" (ADR 0055 § Proof, spike S7).
      - name: Install module dependencies
        run: |
          MIX_ENV=dev mix deps.get
          MIX_ENV=test mix deps.get

      - name: Compile the module with warnings as errors (dev + test)
        run: |
          if ! MIX_ENV=dev mix compile --force --warnings-as-errors; then
            echo "::error::apps/game_stream: mix compile --warnings-as-errors failed in MIX_ENV=dev. Fix the warning; never suppress it."
            exit 1
          fi
          if ! MIX_ENV=test mix compile --force --warnings-as-errors; then
            echo "::error::apps/game_stream: mix compile --warnings-as-errors failed in MIX_ENV=test."
            exit 1
          fi

      - name: Check module formatting
        run: mix format --check-formatted

      # Same crash-detector shape as `Run tests` in `test`: the step fails if
      # the pass prints no ExUnit summary or runs fewer than
      # MIN_PLAY_TEST_COUNT tests. No retry: the module's suite is small, and
      # a first-pass failure here is the signal.
      - name: Run module tests
        run: |
          set -o pipefail
          log="${RUNNER_TEMP:-.}/mix-test-with-play.log"
          mix test 2>&1 | tee "$log"
          # ExUnit 1.20 summary shape; see assert_test_count_floor in `test`.
          summary=$(grep -oE 'Result: [0-9]+(/[0-9]+)? (passed|tests)' "$log" | tail -n1 || true)
          if [ -z "$summary" ]; then
            echo
            echo "::error::apps/game_stream mix test printed no ExUnit summary line (Result: N passed) — the suite did not run to completion"
            exit 1
          fi
          count=$(printf '%s' "$summary" | grep -oE '[0-9]+' | tail -n1)
          if [ "$count" -lt "$MIN_PLAY_TEST_COUNT" ]; then
            echo
            echo "::error::apps/game_stream mix test ran $count tests, below MIN_PLAY_TEST_COUNT=$MIN_PLAY_TEST_COUNT"
            exit 1
          fi
          echo "apps/game_stream mix test ran $count tests (floor MIN_PLAY_TEST_COUNT=$MIN_PLAY_TEST_COUNT)"

      # The release host is the with-modules image's Mix project. Generating
      # the asset inputs here is also what the bundle guard below builds from.
      - name: Compile the release host and generate its asset inputs
        working-directory: apps/burrow_release
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          if ! mix compile --warnings-as-errors; then
            echo "::error::apps/burrow_release: mix compile --warnings-as-errors failed in MIX_ENV=dev."
            exit 1
          fi
          mix format --check-formatted
          mix platform.extensions.assets --out assets/generated
          mix tailwind.install --if-missing
          mix tailwind platform --minify

      # Core's bundle guards esbuild-build js/app.js against apps/platform/deps
      # (phoenix's JS), so core's deps are fetched too.
      - name: Install core dependencies (bundle guard)
        working-directory: apps/platform
        run: mix deps.get

      # A with-modules stylesheet may add rules, never lose one of core's. The
      # first with-Play image lost every vendored `hero-*` icon this way
      # (scripts/check-flavour-css.sh says how), with a green build.
      - name: Compare the with-Play stylesheet against core's
        working-directory: apps/platform
        run: |
          mix tailwind.install --if-missing
          mix tailwind platform --minify
          sh "$GITHUB_WORKSPACE/scripts/check-flavour-css.sh" \
            priv/static/assets/css/app.css \
            ../burrow_release/priv/static/assets/css/app.css

      - name: Set up Node (with Play)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/platform/assets/package-lock.json
            apps/game_stream/assets/package-lock.json

      - name: Run the module's JS tests
        working-directory: apps/game_stream/assets
        run: |
          npm ci
          if ! npx vitest run; then
            echo "::error::vitest failed in apps/game_stream/assets."
            exit 1
          fi

      - name: Run the bundle guards on the with-Play app.js
        working-directory: apps/platform/assets
        # $GITHUB_WORKSPACE at run time, not `${{ github.workspace }}`: in a
        # container job the expression is the HOST path, which the container
        # does not have.
        run: |
          export BURROW_EXTENSIONS_JS="$GITHUB_WORKSPACE/apps/burrow_release/assets/generated/extensions.js"
          export SUITE_EXTENSIONS_JS="$BURROW_EXTENSIONS_JS"
          npm ci
          if ! node --test test/no_excalidraw_in_app_bundle_test.mjs test/no_emoji_data_in_app_bundle_test.mjs; then
            echo "::error::a bundle guard failed on the WITH-Play app.js (BURROW_EXTENSIONS_JS=$BURROW_EXTENSIONS_JS)."
            exit 1
          fi

      - name: Hand the workspace back to the runner (with Play)
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE"/apps/*/deps/*/_build || true
          chown -R 1000:1000 "$GITHUB_WORKSPACE" || true

  # The WITH-Social build (task 01a140a8, stack social-tab): the same module
  # proof `Test (with Play)` runs for Play, for apps/social. The module compiles
  # against core with --warnings-as-errors in dev and test, is formatted, and
  # its own ExUnit suite passes (its `test` alias creates the database and
  # migrates core's path AND the module's, as Platform.Release.migrate/0 does).
  # The release host and its asset/bundle guards are proven once, in
  # `Test (with Play)`, whose host config registers both modules.
  test-with-social:
    name: Test (with Social)
    runs-on: [self-hosted, linux, x64]
    container:
      image: elixir:1.20.4-otp-28-slim
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: apps/social

    steps:
      - uses: actions/checkout@v5

      - name: Install system packages (with Social)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git
          update-ca-certificates

      - name: Install Hex and Rebar (with Social)
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Cache module deps (with Social)
        uses: actions/cache@v5
        with:
          path: |
            apps/social/deps
            apps/platform/deps
          key: deps-with-social-${{ hashFiles('apps/social/mix.lock', 'apps/platform/mix.lock') }}
          restore-keys: deps-with-social-

      # Once per env, for the reason given on `Test (with Play)`.
      - name: Install module dependencies (with Social)
        run: |
          MIX_ENV=dev mix deps.get
          MIX_ENV=test mix deps.get

      - name: Compile the module with warnings as errors (dev + test)
        run: |
          if ! MIX_ENV=dev mix compile --force --warnings-as-errors; then
            echo "::error::apps/social: mix compile --warnings-as-errors failed in MIX_ENV=dev. Fix the warning; never suppress it."
            exit 1
          fi
          if ! MIX_ENV=test mix compile --force --warnings-as-errors; then
            echo "::error::apps/social: mix compile --warnings-as-errors failed in MIX_ENV=test."
            exit 1
          fi

      - name: Check module formatting (with Social)
        run: mix format --check-formatted

      # Same crash-detector shape as `Run module tests` in `Test (with Play)`.
      - name: Run module tests (with Social)
        run: |
          set -o pipefail
          log="${RUNNER_TEMP:-.}/mix-test-with-social.log"
          mix test 2>&1 | tee "$log"
          summary=$(grep -oE 'Result: [0-9]+(/[0-9]+)? (passed|tests)' "$log" | tail -n1 || true)
          if [ -z "$summary" ]; then
            echo
            echo "::error::apps/social mix test printed no ExUnit summary line (Result: N passed) — the suite did not run to completion"
            exit 1
          fi
          count=$(printf '%s' "$summary" | grep -oE '[0-9]+' | tail -n1)
          if [ "$count" -lt "$MIN_SOCIAL_TEST_COUNT" ]; then
            echo
            echo "::error::apps/social mix test ran $count tests, below MIN_SOCIAL_TEST_COUNT=$MIN_SOCIAL_TEST_COUNT"
            exit 1
          fi
          echo "apps/social mix test ran $count tests (floor MIN_SOCIAL_TEST_COUNT=$MIN_SOCIAL_TEST_COUNT)"

      - name: Hand the workspace back to the runner (with Social)
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE"/apps/*/deps/*/_build || true
          chown -R 1000:1000 "$GITHUB_WORKSPACE" || true

  # MULTI-ARCH IMAGE (task 01a0d6ab). One leg per architecture, each built
  # NATIVELY on a runner of that architecture, never under QEMU: the release
  # compiles every dep under MIX_ENV=prod, copies ERTS out of the build image,
  # `mix assets.deploy` downloads per-arch tailwind/esbuild binaries, and vix
  # fetches a precompiled NIF (plus libvips) for the BUILD host's arch. So an
  # arm64 image has to be built on arm64. GitHub-hosted `ubuntu-24.04-arm`
  # was measured picking up jobs in this private repo on 2026-09-25.
  #
  # Each leg pushes an untagged image BY DIGEST and uploads that digest as an
  # artifact; `publish-manifest` below stitches the two into one manifest list
  # and applies the tags. No tag exists until both legs (and the arm64 NIF
  # smoke run) have passed, so a broken arm64 build can never replace
  # `latest` with an amd64-only or half-built list.
  build-and-push:
    name: Build and push image (${{ matrix.arch }})
    if: github.event_name == 'push'
    needs: [test, test-with-play, test-with-social]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: '["self-hosted", "linux", "x64"]'
          - arch: arm64
            platform: linux/arm64
            runner: '"ubuntu-24.04-arm"'
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # Per-job Docker config: the self-hosted runners on one host share
      # ~/.docker/config.json, and a login left behind by a job that dies
      # before its logout step is sent with every later container pull
      # (Docker Hub 'too many failed login attempts', 2026-10-16).
      - name: Isolate Docker credentials to this job
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      # Docker Hub is PULL-ONLY auth here, not a publish target (task 01a14afe):
      # the job still pulls from Docker Hub (setup-buildx-action's
      # moby/buildkit image, and the Dockerfiles' FROM base images), and an
      # anonymous pull from these runners' shared egress IP is rate-limited
      # (toomanyrequests lost PR #1209's merge, 2026-10-07). Nothing is pushed
      # to docker.io.
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          platforms: ${{ matrix.platform }}
          # Per-arch cache scope: with one shared scope the two legs would
          # evict each other's layers on every run.
          cache-from: type=gha,scope=suite-core-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=suite-core-${{ matrix.arch }}
          # Task 01a089d5: the Dockerfile writes GIT_SHA to priv/build_commit, which
          # /health reports. On a push event github.sha is the commit being built.
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Task 01a1449b: optional BuildKit secret for the ffmpeg stage, which
          # fetches the static tarball from the private vendor-ffmpeg-7.0.2
          # release (falls back to johnvansickle without it).
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          outputs: type=image,"name=ghcr.io/getburrowing/core",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: suite-core-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # A NIF that did not load for this arch fails HERE, before any tag is
      # published, not on the first arm64 host that boots the image. The env
      # values are throwaway dummies generated per run (no DB is contacted:
      # `eval` loads config and code but starts no application).
      # The run pulls the digest from GHCR, the only registry the build pushes
      # to (task 01a14dd8; Docker Hub publishing stopped with task 01a14afe).
      - name: Smoke-run the image natively (NIFs load)
        env:
          IMAGE: ghcr.io/getburrowing/core@${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
        run: |
          d() { head -c 48 /dev/urandom | base64 | tr -d '\n'; }
          out="$(docker run --rm \
            -e DATABASE_URL=ecto://smoke:smoke@127.0.0.1:1/smoke \
            -e SECRET_KEY_BASE="$(d)$(d)" \
            -e VAULT_MASTER_KEY="$(head -c 32 /dev/urandom | base64)" \
            -e ATTACHMENT_SIGNING_KEY="$(d)" \
            -e MEETING_GUEST_SIGNING_KEY="$(d)" \
            -e MEETING_CALENDAR_SIGNING_KEY="$(d)" \
            -e PHX_HOST=smoke.invalid \
            "$IMAGE" /app/bin/platform eval '
              IO.puts("arch=" <> List.to_string(:erlang.system_info(:system_architecture)))
              IO.puts("vips=" <> Vix.Vips.version())
              {:ok, img} = Vix.Vips.Operation.black(4, 3)
              IO.puts("vips_op=" <> inspect({Vix.Vips.Image.width(img), Vix.Vips.Image.height(img)}))
              IO.puts("crypto=" <> Base.encode16(:crypto.hash(:sha256, "smoke"), case: :lower))
              IO.puts("code_mode=" <> inspect(Platform.CodeMode.Run.eval("1+1")))
            ')"
          echo "$out"
          echo "$out" | grep -q "^arch=${EXPECTED_ARCH}-" || { echo "::error::image arch is not ${EXPECTED_ARCH}"; exit 1; }
          echo "$out" | grep -q '^vips_op={4, 3}$' || { echo "::error::vix NIF did not run"; exit 1; }
          echo "$out" | grep -q '^crypto=[0-9a-f]\{64\}$' || { echo "::error::crypto NIF did not run"; exit 1; }
          # Wasmex (task 01a114a8 stage 2): the wasmtime NIF loads for this
          # arch AND the vendored QuickJS wasm runs a script (suite_run).
          echo "$out" | grep -q '^code_mode={:ok, 2}$' || { echo "::error::wasmex NIF or code_mode wasm did not run"; exit 1; }

  publish-manifest:
    name: Publish multi-arch manifest
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Derive image tags
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Derive a docker-safe branch tag: refs/heads/feat/reskin → feat-reskin
          BRANCH_TAG="${GITHUB_REF#refs/heads/}"
          BRANCH_TAG="${BRANCH_TAG//\//-}"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: suite-core-digest-*
          merge-multiple: true

      # Per-job Docker config: the self-hosted runners on one host share
      # ~/.docker/config.json, and a login left behind by a job that dies
      # before its logout step is sent with every later container pull
      # (Docker Hub 'too many failed login attempts', 2026-10-16).
      - name: Isolate Docker credentials to this job
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      # Docker Hub is PULL-ONLY auth here, not a publish target (task 01a14afe):
      # the job still pulls from Docker Hub (setup-buildx-action's
      # moby/buildkit image, and the Dockerfiles' FROM base images), and an
      # anonymous pull from these runners' shared egress IP is rate-limited
      # (toomanyrequests lost PR #1209's merge, 2026-10-07). Nothing is pushed
      # to docker.io.
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Collect digests
        id: digests
        working-directory: ${{ runner.temp }}/digests
        run: |
          count="$(find . -mindepth 1 -maxdepth 1 -type f | wc -l)"
          if [ "$count" != "2" ]; then
            echo "::error::expected 2 per-arch digests (amd64, arm64), found ${count}"
            exit 1
          fi
          echo "ghcr_refs=$(printf 'ghcr.io/getburrowing/core@sha256:%s ' *)" >> "$GITHUB_OUTPUT"

      - name: Create manifest list (main)
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/getburrowing/core:core \
            -t ghcr.io/getburrowing/core:core-${{ github.sha }} \
            -t ghcr.io/getburrowing/core:core-${{ steps.vars.outputs.short_sha }} \
            ${{ steps.digests.outputs.ghcr_refs }}

      - name: Create manifest list (feature branch)
        if: github.ref != 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/getburrowing/core:core-${{ steps.vars.outputs.branch_tag }} \
            -t ghcr.io/getburrowing/core:core-${{ github.sha }} \
            -t ghcr.io/getburrowing/core:core-${{ steps.vars.outputs.short_sha }} \
            ${{ steps.digests.outputs.ghcr_refs }}

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect ghcr.io/getburrowing/core:core-${{ github.sha }}

  # TWO IMAGE FLAVOURS (ADR 0055 § 9, task 01a0ee08 stage 4), one repo.
  #
  #   core  apps/platform/Dockerfile      without modules  (build-and-push +
  #                                        publish-manifest above: amd64 AND
  #                                        arm64, task 01a0d6ab)
  #   play  apps/burrow_release/Dockerfile with Play (this job: amd64 only)
  #
  # `latest`, `<sha>` and `<short_sha>` stay on the WITH-Play image.
  # Production installs that pull `suite-core:latest` (measured 2026-10-02)
  # each keep their current behaviour on it: Play is still gated inside the
  # module by GAME_STREAM_ENABLED, which an install sets or leaves unset. A
  # without-Play `latest` would remove Play from an install that sets it on
  # the webhook restart that follows this push. Repointing installs to the explicit
  # flavour tags is core-ops' step 3 in ADR 0055 § 9.
  #
  # `needs: publish-manifest` keeps ADR 0055's ordering: the `core` flavour's
  # tags are published FIRST, so `latest` (which installs' auto-update watches)
  # is the last tag to move. The play flavour is amd64-only; an arm64 play
  # image is a named follow-up of task 01a0d6ab (the Mac target runs the
  # `core` flavour).
  #
  # deployment/installer/burrow_install/registry.py IMAGE_FLAVOURS names the
  # flavour tags a rendered install runs; deployment/installer/tests pins
  # that every one of them is published by this workflow.
  build-and-push-play:
    name: Build and push image (play)
    if: github.event_name == 'push'
    needs: publish-manifest
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Derive image tags
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Derive a docker-safe branch tag: refs/heads/feat/reskin → feat-reskin
          BRANCH_TAG="${GITHUB_REF#refs/heads/}"
          BRANCH_TAG="${BRANCH_TAG//\//-}"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

      # Per-job Docker config: the self-hosted runners on one host share
      # ~/.docker/config.json, and a login left behind by a job that dies
      # before its logout step is sent with every later container pull
      # (Docker Hub 'too many failed login attempts', 2026-10-16).
      - name: Isolate Docker credentials to this job
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      # Docker Hub is PULL-ONLY auth here, not a publish target (task 01a14afe):
      # the job still pulls from Docker Hub (setup-buildx-action's
      # moby/buildkit image, and the Dockerfiles' FROM base images), and an
      # anonymous pull from these runners' shared egress IP is rate-limited
      # (toomanyrequests lost PR #1209's merge, 2026-10-07). Nothing is pushed
      # to docker.io.
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push play (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/burrow_release/Dockerfile
          push: true
          cache-from: type=gha,scope=play
          cache-to: type=gha,mode=max,scope=play
          # Same build identity as the core flavour (task 01a089d5).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Task 01a1449b: optional BuildKit secret for the ffmpeg stage, which
          # fetches the static tarball from the private vendor-ffmpeg-7.0.2
          # release (falls back to johnvansickle without it).
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/getburrowing/core:play
            ghcr.io/getburrowing/core:play-${{ github.sha }}
            ghcr.io/getburrowing/core:play-${{ steps.vars.outputs.short_sha }}
            ghcr.io/getburrowing/core:latest
            ghcr.io/getburrowing/core:${{ github.sha }}
            ghcr.io/getburrowing/core:${{ steps.vars.outputs.short_sha }}

      - name: Build and push play (feature branch)
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/burrow_release/Dockerfile
          push: true
          cache-from: type=gha,scope=play
          cache-to: type=gha,mode=max,scope=play
          # Same build identity as the core flavour (task 01a089d5).
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Task 01a1449b: optional BuildKit secret for the ffmpeg stage, which
          # fetches the static tarball from the private vendor-ffmpeg-7.0.2
          # release (falls back to johnvansickle without it).
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/getburrowing/core:play-${{ steps.vars.outputs.branch_tag }}
            ghcr.io/getburrowing/core:play-${{ github.sha }}
            ghcr.io/getburrowing/core:play-${{ steps.vars.outputs.short_sha }}
            ghcr.io/getburrowing/core:${{ steps.vars.outputs.branch_tag }}
            ghcr.io/getburrowing/core:${{ github.sha }}
            ghcr.io/getburrowing/core:${{ steps.vars.outputs.short_sha }}

  build-and-push-agent-host:
    # Native agents' host image, `contained` profile (task 01a10322 stage 3):
    # ghcr.io/getburrowing/burrow-agent-host, :latest and :<sha>, from
    # services/agent-host/Dockerfile. The pre-rename suite-agent-host tags are
    # still pushed beside it on GHCR, because hosts installed before the
    # rename pull that name (task 01a14dd8). Docker Hub is no longer a
    # publish target (task 01a14afe). Pushed ONLY when a
    # push to main changes services/agent-host/**, because every push restarts
    # every agent on an AutoUpdate=registry host. Independent of `test`: nothing in
    # this image is built from the Elixir tree, and its own typecheck and unit
    # tests gate the push. The full_machine profile copies the daemon out of the
    # same image at first boot (deployment/installer/burrow_install/agents.py).
    name: Build and push agent-host image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Did services/agent-host change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A new ref (all-zero BEFORE) or an unknown BEFORE counts as changed.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "agent_host=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- services/agent-host; then
            echo "agent_host=false" >> "$GITHUB_OUTPUT"
            echo "services/agent-host unchanged since $BEFORE; not pushing (each push restarts every agent)"
          else
            echo "agent_host=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck and unit-test the agent host
        if: steps.changed.outputs.agent_host == 'true'
        run: |
          docker run --rm -v "$PWD/services/agent-host:/src:ro" docker.io/oven/bun:1 sh -c \
            'cp -r /src /w && cd /w && bun install --frozen-lockfile && bunx tsc --noEmit && bun test test/unit.test.ts test/legacy.test.ts'

      # Per-job Docker config: the self-hosted runners on one host share
      # ~/.docker/config.json, and a login left behind by a job that dies
      # before its logout step is sent with every later container pull
      # (Docker Hub 'too many failed login attempts', 2026-10-16).
      - name: Isolate Docker credentials to this job
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      # Docker Hub is PULL-ONLY auth here, not a publish target (task 01a14afe):
      # the job still pulls from Docker Hub (setup-buildx-action's
      # moby/buildkit image, and the Dockerfiles' FROM base images), and an
      # anonymous pull from these runners' shared egress IP is rate-limited
      # (toomanyrequests lost PR #1209's merge, 2026-10-07). Nothing is pushed
      # to docker.io.
      - uses: docker/login-action@v4
        if: steps.changed.outputs.agent_host == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: steps.changed.outputs.agent_host == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        if: steps.changed.outputs.agent_host == 'true'

      - name: Build and push agent-host
        if: steps.changed.outputs.agent_host == 'true'
        uses: docker/build-push-action@v7
        with:
          context: services/agent-host
          file: services/agent-host/Dockerfile
          push: true
          cache-from: type=gha,scope=suite-agent-host
          cache-to: type=gha,mode=max,scope=suite-agent-host
          tags: |
            ghcr.io/getburrowing/suite-agent-host:latest
            ghcr.io/getburrowing/suite-agent-host:${{ github.sha }}
            ghcr.io/getburrowing/burrow-agent-host:latest
            ghcr.io/getburrowing/burrow-agent-host:${{ github.sha }}

  # Install-manifest tooling (ADR 0053, task 01a0d69d): the validator and the
  # single-host renderer under deployment/installer. Python STANDARD LIBRARY
  # only, so the stock image needs no apt or pip step.
  #
  # `--user 1000:1000` is safe here, unlike in `test`, precisely because
  # nothing is installed; and it is required on this self-hosted runner, where
  # a root container leaves root-owned files in the shared `_work` checkout
  # (see the WORKSPACE OWNERSHIP note on `test` above).
  #
  # The image has no git, so actions/checkout falls back to a REST download
  # with no .git directory; the renderer's git-worktree refusal test builds its
  # own .git fixtures and does not depend on the checkout being a repository.
  installer:
    name: Installer (validate + render)
    runs-on: [self-hosted, linux, x64]
    container:
      image: python:3.12-slim
      options: --user 1000:1000
    steps:
      - uses: actions/checkout@v5

      - name: Run installer unit tests
        env:
          PYTHONPATH: deployment/installer
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s deployment/installer/tests -v
