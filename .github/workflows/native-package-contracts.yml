name: Native package contracts
on:
  push:
    branches: ['feat/01a1b287-**']
  pull_request:
    paths: ['deployment/game-build/**', '.github/workflows/game-native-build.yml']
permissions: {contents: read}
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 -m unittest discover -s deployment/game-build/tests -v
      - name: Produce formatting patch on the CI runner
        run: |
          docker run --rm -v "$PWD:/source" -w /source elixir:1.20.4-otp-28-slim elixir -e 'Path.wildcard("apps/game_stream/{lib,test}/**/*.ex*") |> Enum.each(fn p -> File.write!(p, [Code.format_string!(File.read!(p)), "\n"]) end)'
          git diff > native-format.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: native-format, path: native-format.patch}
