# Example install manifest, schema v1: target mac, meetings OFF ("mac-lite").
# (ADR 0053, deployment/schema/install-manifest.md; task 01a0d6ab.)
#
# A safe, non-personal example for Docker Desktop or OrbStack on a Mac:
# core + postgres + files + memory, bundled pocket-id for sign-in, reached
# through a Cloudflare tunnel (TLS ends at Cloudflare's edge; no port-forward).
#
# A Mac runs no local model. Memory embeds through a hosted OpenAI-compatible
# API: the key is supplied by NAME (api_key_ref) in --customer-secrets, and
# memory-service reads it from a file mounted into it alone. base_url has no
# /v1 suffix because memory-service appends /v1/embeddings itself.
#
# mac.install.toml is this file with services.meetings = true plus its
# [meetings] table and the STT endpoint.

schema_version = 1

[install]
name = "suite-mac"
size_tier = "small"
target = "mac"

[domain]
primary = "suite.example.test"

[services]
files = true
memory = true
meetings = false

[embeddings]
mode = "endpoint"
base_url = "https://api.openai.com"
model = "text-embedding-3-small"
query_prefix = ""
api_key_ref = "OPENAI_API_KEY"

[access]
mode = "cloudflare-tunnel"
tunnel_token_ref = "TUNNEL_TOKEN"

[auth]
mode = "bundled-pocket-id"

[backup]
target = "none"

[images]
source = "registry"
