# Render fixture (task 01a0d69d stage 2): a GPU host running voice on CUDA.
schema_version = 1

[install]
name = "burrow-gpu-test"

[domain]
primary = "burrow-gpu.test"
tls = "acme"
acme_email = "ops@burrow-gpu.test"

[host]
gpu = true

[services]
files = true
memory = false
voice = true
embeddings = false

[voice]
