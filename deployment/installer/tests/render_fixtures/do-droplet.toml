# One-click DigitalOcean droplet (core task 01a10315 stage 1): what
# Platform.Installs renders for a customer. single-host-agents-full.toml with:
# tls = "acme" + acme_email, images.source = "registry", install.org_name,
# host.ssh_authorized_key, [push] vapid = "generate-on-host" and voice off.
# Stage 6: [embeddings] model_source = "download" (the host fetches the model).
# The key below is a fixture (32 counting bytes), not anyone's key.

schema_version = 1

[install]
name = "burrow-01a0d69d"
size_tier = "medium"
org_name = "Acme Bakery"

[domain]
primary = "burrow-01a0d69d.test"
tls = "acme"
acme_email = "owner@acme-bakery.test"

[host]
gpu = false
ssh_authorized_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAABAgMEBQYHCAkKCwwNDg8QERITFBUWFxgZGhscHR4f do-droplet-fixture"

[services]
files = true
memory = true
voice = false
embeddings = true

[voice]
accelerator = "cuda"

[embeddings]
mode = "local"
model_source = "download"

[auth]
mode = "bundled-pocket-id"

[backup]
target = "none"

[images]
registry = "ghcr.io/example"
source = "registry"

[day2]
upgrade_channel = "stable"
phone_home = false

[agents]
profile = "full_machine"

[push]
vapid = "generate-on-host"
