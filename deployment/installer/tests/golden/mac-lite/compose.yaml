# Generated by suite_install (ADR 0053) for install 'suite-mac'. Do not edit; re-render.
# Target mac, access mode cloudflare-tunnel: TLS ends at that edge; Caddy is plain http.
name: "suite-mac"
services:
  caddy:
    container_name: "caddy"
    image: "docker.io/library/caddy:2"
    restart: "unless-stopped"
    volumes:
      - "caddy-config:/config"
      - "caddy-data:/data"
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
  cloudflared:
    container_name: "cloudflared"
    image: "docker.io/cloudflare/cloudflared:2026.9.3"
    restart: "unless-stopped"
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "run"
    env_file:
      - "secrets.env"
    depends_on:
      caddy:
        condition: "service_started"
  core-platform:
    container_name: "core-platform"
    image: "docker.io/example/suite-core:core"
    restart: "unless-stopped"
    env_file:
      - "secrets.env"
    environment:
      APP_URL: "https://suite.example.test"
      FILES_SERVICE_URL: "http://files-service:8200"
      MEMORY_SERVICE_URL: "http://memory-service:8100"
      OIDC_CLIENT_ID: "suite-core"
      OIDC_ISSUER: "https://auth.suite.example.test"
      OIDC_PKCE_ENABLED: "true"
      PHX_HOST: "suite.example.test"
      PHX_SERVER: "true"
      PORT: "4000"
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - "core-data:/data/platform"
    depends_on:
      core-postgres:
        condition: "service_healthy"
      files-service:
        condition: "service_started"
      memory-service:
        condition: "service_started"
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://localhost:4000/health"
      interval: "30s"
      timeout: "10s"
      retries: 3
      start_period: "30s"
  core-postgres:
    container_name: "core-postgres"
    image: "docker.io/pgvector/pgvector:pg16"
    restart: "unless-stopped"
    env_file:
      - "secrets.env"
    environment:
      POSTGRES_DB: "core_platform"
      POSTGRES_USER: "core_platform"
    volumes:
      - "core-postgres-data:/var/lib/postgresql/data"
      - "./postgres-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test:
        - "CMD"
        - "pg_isready"
        - "-U"
        - "core_platform"
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "180s"
  files-service:
    container_name: "files-service"
    image: "docker.io/example/suite-files-service:latest"
    restart: "unless-stopped"
    env_file:
      - "secrets.env"
    environment:
      PORT: "8200"
  memory-service:
    container_name: "memory-service"
    image: "docker.io/example/suite-memory-service:latest"
    restart: "unless-stopped"
    env_file:
      - "secrets.env"
    environment:
      MEMORY_EMBEDDING_API_KEY_FILE: "/run/secrets/OPENAI_API_KEY"
      MEMORY_EMBEDDING_BACKEND: "http"
      MEMORY_EMBEDDING_MODEL: "text-embedding-3-small"
      MEMORY_EMBEDDING_QUERY_PREFIX: ""
      MEMORY_EMBEDDING_URL: "https://api.openai.com"
      MEMORY_HOST: "0.0.0.0"
      MEMORY_PORT: "8100"
    volumes:
      - "./secrets/OPENAI_API_KEY:/run/secrets/OPENAI_API_KEY:ro"
    depends_on:
      core-postgres:
        condition: "service_healthy"
  pocket-id:
    container_name: "pocket-id"
    image: "ghcr.io/pocket-id/pocket-id:v2.18.0"
    restart: "unless-stopped"
    env_file:
      - "secrets.env"
    environment:
      ANALYTICS_DISABLED: "true"
      APP_URL: "https://auth.suite.example.test"
      TRUST_PROXY: "true"
    volumes:
      - "pocket-id-data:/app/data"
    depends_on:
      core-postgres:
        condition: "service_healthy"
volumes:
  caddy-config: {}
  caddy-data: {}
  core-data: {}
  core-postgres-data: {}
  pocket-id-data: {}
